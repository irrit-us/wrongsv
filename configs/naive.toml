# Naive proxy inbound (HTTP/2 CONNECT over TLS with padded framing).
# Compatible with Naive/naiveproxy-style clients.

listen = "0.0.0.0:443"

[naive]
padding_header_name = "Padding"

# This checked-in localhost certificate lets strict Naive clients pin/trust the
# test server without disabling verification. Public deployments should replace
# it with a trusted certificate; a self-signed ECDSA P-256 certificate is
