# AnyTLS + XTLS Vision + fallback to local HTTP server
# Unauthenticated probes are forwarded to the fallback destination.
listen = "0.0.0.0:443"

[[users]]
id = "12345678-1234-1234-1234-123456789abc"
email = "user@example.com"
flow = "xtls-rprx-vision"

[anytls]
password = "your-secure-password"
dest = "127.0.0.1:8080"
