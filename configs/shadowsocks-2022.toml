# Shadowsocks AEAD-2022 TCP/UDP inbound.
# Compatible with sing-box, mihomo, xray-core, and other clients that support
# the required 2022 BLAKE3/AES-GCM Shadowsocks methods.
#
# AEAD-2022 requires a fixed-length base64 pre-shared key:
#   2022-blake3-aes-128-gcm -> 16 bytes -> openssl rand -base64 16
#   2022-blake3-aes-256-gcm -> 32 bytes -> openssl rand -base64 32

listen = "0.0.0.0:8388"

[shadowsocks]
method = "2022-blake3-aes-128-gcm"
password = "AAAAAAAAAAAAAAAAAAAAAA==" # example 16-byte PSK; replace before use
udp = true
