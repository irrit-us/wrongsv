# AnyTLS with custom TLS certificate and padding scheme
listen = "0.0.0.0:443"

[[users]]
id = "12345678-1234-1234-1234-123456789abc"
email = "user@example.com"
flow = "xtls-rprx-vision"

[anytls]
password = "your-secure-password"
