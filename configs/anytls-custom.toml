# ...
# -----END CERTIFICATE-----"""
# key = """-----BEGIN PRIVATE KEY-----
# ...
# -----END PRIVATE KEY-----"""
# Optional: padding scheme (anytls-go compatible format)
# padding_scheme = """stop=8
# 0=30-30
# 1=100-400
# """
