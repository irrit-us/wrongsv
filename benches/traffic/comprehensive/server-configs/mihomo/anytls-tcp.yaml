mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
listeners:
  - name: anytls-in
    type: anytls
    port: 18443
    listen: 127.0.0.1
    users:
      user@example.com: your-secure-password
    certificate: ./cert.pem
    private-key: ./key.pem
proxies: []
proxy-groups: []
rules:
  - MATCH,DIRECT
