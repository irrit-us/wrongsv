[package]
name = "wrongsv"
version.workspace = true
edition.workspace = true

[workspace]
resolver = "2"
members = [
    "crates/uuid",
    "crates/net-types",
    "crates/protocol",
    "crates/vless-encoding",
    "crates/vless",
    "crates/encryption",
    "crates/server",
    "crates/kyber",
    "crates/reality",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
wrongsv-uuid = { path = "crates/uuid" }
wrongsv-net-types = { path = "crates/net-types" }
wrongsv-protocol = { path = "crates/protocol" }
wrongsv-vless-encoding = { path = "crates/vless-encoding" }
wrongsv-vless = { path = "crates/vless" }
wrongsv-encryption = { path = "crates/encryption" }
wrongsv-server = { path = "crates/server" }
wrongsv-kyber = { path = "crates/kyber" }
wrongsv-reality = { path = "crates/reality" }

bytes = "1"
thiserror = "2"
prost = "0.14"
sha2 = "0.10"
md-5 = "0.10"
rand = "0.8"
blake3 = "1"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = { version = "3", default-features = false }

[dependencies]
wrongsv-server.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true

[build-dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
base64 = "0.22"
ml-kem = { version = "0.3", features = ["getrandom"] }

[dev-dependencies]
serde_json = "1"
wrongsv-protocol.workspace = true
wrongsv-uuid.workspace = true
wrongsv-vless-encoding.workspace = true
wrongsv-vless.workspace = true
wrongsv-net-types.workspace = true
wrongsv-server.workspace = true
wrongsv-kyber.workspace = true
bytes.workspace = true
rand.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
criterion = "0.5"

[[bench]]
name = "throughput"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
