[workspace]
resolver = "2"
members = [
    "crates/uuid",
    "crates/net-types",
    "crates/protocol",
    "crates/vless-encoding",
    "crates/vless",
    "crates/encryption",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
wrongsv-uuid = { path = "crates/uuid" }
wrongsv-net-types = { path = "crates/net-types" }
wrongsv-protocol = { path = "crates/protocol" }
wrongsv-vless-encoding = { path = "crates/vless-encoding" }
wrongsv-vless = { path = "crates/vless" }
wrongsv-encryption = { path = "crates/encryption" }
wrongsv-server = { path = "crates/server" }

bytes = "1"
thiserror = "2"
prost = "0.14"
sha2 = "0.10"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
blake3 = "1"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
ring = "0.17"
x25519-dalek = "2"
ml-kem = "0.2"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
