name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ""
            rustflags: "-Ctarget-cpu=x86-64"
            target_cflags: ""
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            suffix: ""
            rustflags: "-Ctarget-cpu=x86-64"
            target_cflags: "-march=x86-64 -mtune=generic"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: ".exe"
            rustflags: "-Ctarget-cpu=x86-64"
            target_cflags: ""
          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
            suffix: ""
            rustflags: "-Ctarget-cpu=x86-64"
            target_cflags: ""
            use_cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure target is installed
        if: ${{ !matrix.use_cross }}
        run: rustup target add ${{ matrix.target }}

      - name: Install protoc
        if: ${{ !matrix.use_cross }}
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update -y && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}
        env:
          CARGO_BUILD_RUSTFLAGS: ${{ matrix.rustflags }}
          TARGET_CFLAGS: ${{ matrix.target_cflags }}
          TARGET_CXXFLAGS: ${{ matrix.target_cflags }}
          CROSS_CONTAINER_OPTS: "--env PROTOC=/usr/local/bin/protoc"

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_BUILD_RUSTFLAGS: ${{ matrix.rustflags }}
          TARGET_CFLAGS: ${{ matrix.target_cflags }}
          TARGET_CXXFLAGS: ${{ matrix.target_cflags }}

      - name: Strip and package (Linux native)
        if: runner.os == 'Linux' && !matrix.use_cross
        run: |
          strip target/${{ matrix.target }}/release/wrongsv \
            -o wrongsv-${{ matrix.target }}${{ matrix.suffix }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp "target/${{ matrix.target }}/release/wrongsv${{ matrix.suffix }}" "wrongsv-${{ matrix.target }}${{ matrix.suffix }}"

      - name: Package (FreeBSD cross)
        if: matrix.use_cross
        run: cp "target/${{ matrix.target }}/release/wrongsv" "wrongsv-${{ matrix.target }}${{ matrix.suffix }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrongsv-${{ matrix.target }}${{ matrix.suffix }}
          path: wrongsv-${{ matrix.target }}${{ matrix.suffix }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wrongsv-*
          merge-multiple: true

      - name: Generate release notes
        id: notes
        run: |
          # Extract the annotated tag message body, or commit subject if lightweight
          TAG_MSG=$(git tag -l --format='%(contents:body)' "${{ github.ref_name }}")
          if [ -z "$TAG_MSG" ]; then
            TAG_MSG=$(git log -1 --format='%B' "${{ github.ref_name }}")
          fi
          # Use the first line as short description, rest as body
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            wrongsv-x86_64-unknown-linux-gnu
            wrongsv-x86_64-unknown-linux-musl
            wrongsv-x86_64-pc-windows-msvc.exe
            wrongsv-x86_64-unknown-freebsd
